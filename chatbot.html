<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:#0d0d0e;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:#f8f5ef;
}

/* CHATBOT CONTAINER */
.chatbot{
  width:360px;
  max-width:95%;
  background:#13130f;
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}

/* HEADER */
.chat-header{
  padding:1rem;
  text-align:center;
  font-weight:600;
  border-bottom:1px solid rgba(255,255,255,.08);
}

/* MESSAGES */
.chat-body{
  flex:1;
  padding:1rem;
  overflow-y:auto;
}

.message{
  margin-bottom:.8rem;
  line-height:1.5;
  max-width:85%;
}

.bot{
  background:#1f1f1b;
  padding:.6rem .8rem;
  border-radius:12px 12px 12px 0;
}

.user{
  background:#c9a84c;
  color:#0d0d0e;
  padding:.6rem .8rem;
  border-radius:12px 12px 0 12px;
  margin-left:auto;
}

/* INPUT */
.chat-input{
  display:flex;
  border-top:1px solid rgba(255,255,255,.08);
}

.chat-input input{
  flex:1;
  background:none;
  border:none;
  padding:1rem;
  color:#f8f5ef;
  outline:none;
}

.chat-input button{
  background:#c9a84c;
  border:none;
  padding:0 1.2rem;
  cursor:pointer;
  font-weight:600;
}
</style>
</head>

<body>

<div class="chatbot">
  <div class="chat-header">Ask Me Anything</div>

  <div class="chat-body" id="chatBody">
    <div class="message bot">Hello 👋 How can I help you today?</div>
  </div>

  <div class="chat-input">
    <input id="userInput" placeholder="Type your message..." />
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
function sendMessage(){
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if(!text) return;

  const chatBody = document.getElementById("chatBody");

  // User message
  const userMsg = document.createElement("div");
  userMsg.className = "message user";
  userMsg.textContent = text;
  chatBody.appendChild(userMsg);

  input.value = "";
  chatBody.scrollTop = chatBody.scrollHeight;

  // Bot reply (simple logic)
  setTimeout(()=>{
    const botMsg = document.createElement("div");
    botMsg.className = "message bot";
    botMsg.textContent = getBotReply(text);
    chatBody.appendChild(botMsg);
    chatBody.scrollTop = chatBody.scrollHeight;
  },600);
}

function getBotReply(msg){
  msg = msg.toLowerCase();

  if(msg.includes("hello") || msg.includes("hi"))
    return "Hello! 😊";

  if(msg.includes("services"))
    return "I offer AI solutions, web design, hosting, and digital innovation.";

  if(msg.includes("contact"))
    return "You can reach me at barinderpal.singh013@gmail.com";

  return "Thanks for your message! I’ll get back to you soon.";
}

// Enter key support
document.getElementById("userInput").addEventListener("keydown",e=>{
  if(e.key==="Enter") sendMessage();
});
</script>

</body>
</html>
